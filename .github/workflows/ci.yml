# ============================================================
# CI 门禁（3 层，2026-08-28 起）
#
# 触发：push main/dev + PR 到 main（PR 到 dev 不触发，dev 是开发集散地）
#   并发：同分支新提交取消在跑任务（cancel-in-progress），省 CI 分钟
#
# 分层（各层独立 job，L1 依赖 L0 全绿才跑）：
#   L0 lint  —— ruff F 类（pyflakes：未定义名/未用 import/未用变量），秒级
#   L0 build —— 前端 npm build，独立维度
#   L1 unit  —— pytest tests/unit -m "not external"（离线，无外部服务依赖，
#               327 用例全 mock 隔离，CI 不需要 MySQL/Redis/Milvus/Neo4j）
#   L2 全量 —— 依赖真实中间件 + 外部 key（Neo4j/Milvus/BGE-M3/DeepSeek），
#               本地 Docker 手动跑（tests/integration + e2e），CI 不自动执行
#
# 注意：
#   - ruff 只选 F 类：B008（FastAPI Depends 误报）/I001（排序）/format 均为
#     风格偏好，未纳入首版门禁（存量 380 错，且格式重排 136 文件违背不碰
#     无关代码），单独治理。
#   - 无 secrets：L0/L1 全 mock，不需要 DEEPSEEK_API_KEY 等。
# ============================================================

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==================== L0：Python 静态检查 ====================
  l0-lint:
    name: L0 · ruff (F-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry

      - name: 安装依赖（dev extra，含 ruff）
        run: |
          pip install poetry
          poetry install -E dev

      - name: ruff F 类静态检查
        run: poetry run ruff check app tests --select F

  # ==================== L0：前端构建 ====================
  l0-build:
    name: L0 · 前端 build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装前端依赖
        run: npm ci
        working-directory: web

      - name: 前端构建
        run: npm run build
        working-directory: web

  # ==================== L1：核心单元测试（离线） ====================
  l1-unit:
    name: L1 · 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [l0-lint, l0-build]  # L0 门禁不过则跳过，省 CI 分钟
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry

      - name: 安装依赖
        run: |
          pip install poetry
          poetry install -E dev

      - name: 单元测试（external 过滤，离线全绿）
        run: poetry run pytest tests/unit -m "not external"
