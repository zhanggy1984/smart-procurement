# ============================================================
# smart-procurement Web 服务（P7.4 E2E / P7.7 一键部署）
# 职责：静态服务前端构建产物（web/dist）+ API 反代到 FastAPI app
# 关键点：
#   - SPA fallback：前端 vue-router history 模式，非 /api 路径回退 index.html
#   - SSE 反代必须关缓冲：评审工作台 AI 评分/追问走 fetch 流式读取，
#     nginx 缓冲会导致逐块延迟，前端永远等不到 '\n\n' 帧分隔
#   - client_max_body_size 100m：标书 PDF 可达 50MB+，默认 1m 会直接挡掉
# ============================================================

server {
    listen 80;
    server_name _;

    # 前端静态产物（web/dist 挂载）
    root /usr/share/nginx/html;
    index index.html;

    # 标书上传：允许 100MB（业务限 50MB+1 触发 413 需透传到后端）
    client_max_body_size 100m;

    # ---------- API 反代 ----------
    location /api/v1/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE：关缓冲 + 不缓存 + 长读超时（评审流式评分/对话）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 健康检查
    location /health/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---------- SPA 静态资源 ----------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 其余路径回退 index.html（vue-router history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
