# ============================================================
# AI 智能评标系统 — 开发环境编排（P0.2：5 中间件）
# MySQL / Neo4j / Milvus / MinIO / Redis
# P0.3 追加 FastAPI App / arq Worker / BGE-M3 应用容器
# 一键启动: docker compose up -d
# ============================================================

name: smart-procurement

networks:
  backend:
    driver: bridge

volumes:
  mysql-data:
  neo4j-data:
  milvus-data:
  minio-data:
  redis-data:
  bge-m3-model:

services:
  # ==================== MySQL 8.0（硬依赖） ====================
  mysql:
    image: mysql:8.0
    container_name: sp-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smart_procurement}
      MYSQL_USER: ${MYSQL_USER:-smart}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-smart_procurement_dev}
    ports:
      # 宿主端口模板化（避同机 cs/rag 栈冲突，值在 .env 的 MYSQL_PORT）
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 1g
    cpus: "1.0"
    restart: unless-stopped
    networks:
      - backend

  # ==================== Neo4j 5.x（硬依赖） ====================
  neo4j:
    image: neo4j:5
    container_name: sp-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4j_dev_pass}
      NEO4J_server_memory_heap_max__size: 1024m
      NEO4J_server_memory_pagecache_size: 512m
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_default__listen__address: 0.0.0.0
    ports:
      - "7474:7474"   # HTTP (Browser)
      - "7687:7687"   # Bolt
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    mem_limit: 2g
    cpus: "1.0"
    restart: unless-stopped
    networks:
      - backend

  # ==================== Milvus 2.4 Standalone（软依赖） ====================
  # 单容器 standalone 模式：embedded etcd + 复用外部 MinIO 容器做对象存储，
  # 满足 task.md "5 个中间件容器" 约束。数据落在 /var/lib/milvus（milvus-data 卷）。
  milvus:
    image: milvusdb/milvus:v2.4.15
    container_name: sp-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      # 凭据通过环境变量注入（变量名是 Milvus 标准名，与 MinIO 容器共用 .env）
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minio_dev_pass}
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "${MILVUS_PORT:-19530}:19530"  # gRPC（宿主端口模板化，值在 .env）
      - "9091:9091"                    # metrics / health
    volumes:
      - milvus-data:/var/lib/milvus
      # 完整配置（仅改 use.embed=true + minio 指向）：避免端口分配错乱
      - ./docker/milvus/milvus.full.yaml:/milvus/configs/milvus.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9091/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    mem_limit: 4g
    cpus: "2.0"
    restart: unless-stopped
    networks:
      - backend

  # ==================== MinIO（软依赖，标书存储） ====================
  minio:
    image: minio/minio:latest
    container_name: sp-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minio_dev_pass}
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    mem_limit: 512m
    cpus: "0.5"
    restart: unless-stopped
    networks:
      - backend

  # ==================== Redis 7（硬依赖，arq 队列 + 缓存） ====================
  redis:
    image: redis:7-alpine
    container_name: sp-redis
    command: redis-server --appendonly yes
    ports:
      # 宿主端口模板化（值在 .env 的 REDIS_PORT）
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    mem_limit: 512m
    cpus: "0.5"
    restart: unless-stopped
    networks:
      - backend

  # ==================== FastAPI App（硬依赖 MySQL/Redis/Neo4j） ====================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sp-app
    environment:
      MYSQL_HOST: mysql
      MYSQL_URL: mysql+asyncmy://${MYSQL_USER:-smart}:${MYSQL_PASSWORD:-smart_procurement_dev}@mysql:3306/${MYSQL_DATABASE:-smart_procurement}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j_dev_pass}
      MILVUS_HOST: milvus
      MINIO_ENDPOINT: minio:9000
      REDIS_URL: redis://redis:6379/0
      DATASOURCE_MODE: ${DATASOURCE_MODE:-synthetic}
      DEBUG: ${DEBUG:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-sk-xxx}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      BGE_M3_ENDPOINT: http://bge-m3:8081
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
    ports:
      # 宿主端口模板化：4.2 起 sp 用 8002（避开 cs 8000 / cc 8001 / gq 8080，评测 seed 依赖稳定端口）
      - "${SP_APP_PORT:-8002}:8000"
    volumes:
      - ./app:/app/app:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      milvus:
        condition: service_healthy
    mem_limit: 1g
    cpus: "1.0"
    restart: unless-stopped
    networks:
      - backend

  # ==================== arq Worker（共享 App 镜像，仅启动命令不同） ====================
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sp-worker
    command: arq app.tasks.worker.WorkerSettings
    environment:
      MYSQL_HOST: mysql
      MYSQL_URL: mysql+asyncmy://${MYSQL_USER:-smart}:${MYSQL_PASSWORD:-smart_procurement_dev}@mysql:3306/${MYSQL_DATABASE:-smart_procurement}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j_dev_pass}
      MILVUS_HOST: milvus
      MINIO_ENDPOINT: minio:9000
      REDIS_URL: redis://redis:6379/0
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-sk-xxx}
      BGE_M3_ENDPOINT: http://bge-m3:8081
    volumes:
      - ./app:/app/app:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1g
    cpus: "1.0"
    restart: unless-stopped
    networks:
      - backend

  # ==================== BGE-M3 Embedding 服务（软依赖，骨架先行） ====================
  bge-m3:
    build:
      context: ./docker/bge-m3
      dockerfile: Dockerfile
    container_name: sp-bge-m3
    environment:
      # huggingface.co 国内不可达，走 hf-mirror 镜像下载 BAAI/bge-m3（一次进卷长期复用）
      HF_ENDPOINT: https://hf-mirror.com
      # app 用户 home=/app，HF 缓存落到卷目录（Dockerfile 已 chown app:app）
      HF_HOME: /app/.cache
    ports:
      # 宿主端口模板化（值在 .env 的 BGE_M3_PORT）
      - "${BGE_M3_PORT:-8081}:8081"
    volumes:
      - bge-m3-model:/app/.cache
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8081/health', timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    mem_limit: 4g
    cpus: "2.0"
    restart: unless-stopped
    networks:
      - backend

  # ==================== nginx Web（前端静态 + API 反代，P7.4 E2E / P7.7） ====================
  # 静态服务 web/dist 构建产物，/api/v1、/health 反代到 FastAPI app。
  # SSE 已在 nginx.conf 关闭缓冲（评审 AI 评分/追问流式读取必需）。
  nginx:
    image: nginx:1.27-alpine
    container_name: sp-web
    ports:
      # 宿主端口模板化（值在 .env 的 WEB_PORT）
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - backend
