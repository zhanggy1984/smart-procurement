# ============================================================
# smart-procurement — 共享 infra 模式（全共享方案，2026-08-25 起）
#
# 本 agent 不自带任何中间件，全部依赖共享 infra：
#   mysql  -> infra MySQL（库 smart_procurement / 账号 smart）
#   neo4j  -> infra Neo4j（bolt://neo4j:7687，sp 是唯一图谱用户）
#   milvus -> infra Milvus（collection sp_bid_documents，sp_ 前缀隔离）
#   minio  -> infra MinIO（bucket bid-files，sp 标书存储）
#   redis  -> infra Redis（db index 0，arq 队列 + 缓存）
#   bge-m3 -> infra BGE-M3（embedding 服务，2026-08-25 从本 agent 迁入共享）
#
# 前置：先部署共享 infra（D:/study/aiprojcet/infra，`docker compose up -d`）。
# 启动：docker compose up -d --build
# 连接：前端 http://localhost:18080 / 后端 http://localhost:18002
#
# 表结构：sp 用 alembic 管理（手动执行，迁移数据已含表 + alembic_version），
#   应用启动只做连通性校验 + Milvus load，不重建数据。
# ============================================================

name: smart-procurement

services:
  # ==================== FastAPI App（硬依赖 mysql/neo4j/redis） ====================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sp-app
    environment:
      # MySQL（连接串显式覆盖 .env，pydantic-settings env 优先）
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: smart_procurement
      MYSQL_USER: smart
      MYSQL_PASSWORD: smart_procurement_dev
      MYSQL_URL: mysql+asyncmy://smart:smart_procurement_dev@mysql:3306/smart_procurement
      # Neo4j（共享，sp 唯一用户，密码与 sp 旧值一致）
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: neo4j_dev_pass
      # Milvus（共享 v2.5.4，collection sp_ 前缀）
      MILVUS_HOST: milvus
      MILVUS_COLLECTION: sp_bid_documents
      # MinIO（共享 minioadmin/minioadmin，覆盖 sp 旧 minio_dev_pass）
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      # Redis（共享 db index 0，sp 约定槽位）
      REDIS_URL: redis://redis:6379/0
      # 运行模式与 AI 服务
      DATASOURCE_MODE: ${DATASOURCE_MODE:-synthetic}
      DEBUG: ${DEBUG:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?deepseek_api_key 必须设置}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      BGE_M3_ENDPOINT: http://bge-m3:8081
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
    ports:
      - "${SP_APP_PORT:-18002}:8000"
    volumes:
      - ./app:/app/app:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    mem_limit: 1g
    cpus: "1.0"
    restart: unless-stopped
    networks:
      - shared-infra

  # ==================== arq Worker（共享 App 镜像，仅启动命令不同） ====================
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sp-worker
    command: arq app.tasks.worker.WorkerSettings
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: smart_procurement
      MYSQL_USER: smart
      MYSQL_PASSWORD: smart_procurement_dev
      MYSQL_URL: mysql+asyncmy://smart:smart_procurement_dev@mysql:3306/smart_procurement
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: neo4j_dev_pass
      MILVUS_HOST: milvus
      MILVUS_COLLECTION: sp_bid_documents
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      REDIS_URL: redis://redis:6379/0
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?deepseek_api_key 必须设置}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      BGE_M3_ENDPOINT: http://bge-m3:8081
    volumes:
      - ./app:/app/app:ro
    mem_limit: 1g
    cpus: "1.0"
    restart: unless-stopped
    networks:
      - shared-infra

  # ==================== nginx Web（前端静态 + API 反代，SSE 已关缓冲） ====================
  nginx:
    image: nginx:1.27-alpine
    container_name: sp-web
    ports:
      - "${WEB_PORT:-18080}:80"
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - shared-infra

networks:
  shared-infra:
    external: true
    name: shared-infra_shared-infra
